name: Tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,llm]'
      - run: python -m pip check
      - run: python -m pytest -q
      - name: Lint
        shell: bash
        run: |
          ruff check . > lint-report.txt 2>&1 || true
          cat lint-report.txt >> "$GITHUB_STEP_SUMMARY"
          ruff check .
      - run: git diff --check
