[build-system]
requires = ["setuptools>=69,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "bearing-agents"
version = "0.1.0"
description = "Domain foundation for a cylindrical hydrodynamic journal bearing design assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic==2.12.5"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.17.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

